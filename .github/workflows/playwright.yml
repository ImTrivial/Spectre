name: Playwright Tests
on:
  workflow_dispatch:
  schedule:
    - cron: "07,37 * * * *"

# Prevents two runs from being logged into the same game account at once if
# a run takes close to the full 30-minute cadence between scheduled
# triggers - queues the next run instead of letting them overlap.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  test:
    # Must stay above the Playwright test's own timeout (currently 20
    # minutes, set via test.setTimeout in airlineManager.spec.ts) plus
    # setup/install time - otherwise GitHub Actions hard-kills the whole
    # job before Playwright's timeout or the test's own try/finally cleanup
    # (Discord failure notification, page.close()) ever gets to run.
    timeout-minutes: 25
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm ci
      
    - name: Get Playwright version
      id: pw-version
      run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

    - uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}

    - name: Disable Man-DB Auto-Update
      run: |
        sudo debconf-set-selections <<< "man-db man-db/auto-update boolean false"
        sudo dpkg-reconfigure man-db

    - name: Install Playwright Browsers
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"
      run: npx playwright install --with-deps chromium

    - name: Create .env file
      run: |
        touch .env
        echo "EMAIL=${{ secrets.EMAIL }}" >> .env
        echo "PASSWORD=${{ secrets.PASSWORD }}" >> .env
        echo "MAX_FUEL_PRICE=${{ vars.MAX_FUEL_PRICE }}" >> .env
        echo "MAX_CO2_PRICE=${{ vars.MAX_CO2_PRICE }}" >> .env
        echo "INCREASE_AIRLINE_REPUTATION=${{ vars.INCREASE_AIRLINE_REPUTATION }}" >> .env
        echo "CAMPAIGN_TYPE=${{ vars.CAMPAIGN_TYPE }}" >> .env
        echo "CAMPAIGN_DURATION=${{ vars.CAMPAIGN_DURATION }}" >> .env
        echo "DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}" >> .env

    - name: Run Playwright tests
      run: npx playwright test
