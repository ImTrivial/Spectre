name: Schedule Test

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Scheduler test
        run: |
          echo "SCHEDULE TRIGGER WORKED"
          echo "Event: ${{ github.event_name }}"
          echo "UTC time:"
          date -u
